# Supabase pauses free projects after a week with no requests. This pings it twice a week so it stays up.
# Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets (Settings -> Secrets and variables -> Actions).
name: keep Supabase awake
on:
  schedule:
    - cron: '17 20 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "$SUPABASE_URL/rest/v1/papers?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null && echo awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
