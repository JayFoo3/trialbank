# Supabase pauses free projects after a week with no requests. This pings it twice a week so it stays up.
# The URL and publishable key are already public in site/app.js, so no repo secrets are needed.
name: keep Supabase awake
on:
  schedule:
    - cron: '17 20 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://xqkdggyksufbthskmmdz.supabase.co
          SUPABASE_KEY: sb_publishable_eJI_qmdm7H6VTax5x5zx8g_9MvxlIFz
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o body.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/signup_reason" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
              -d '{"p_email":"keepalive@example.com","p_code":""}') || code=000
            echo "attempt $i: HTTP $code $(cat body.txt 2>/dev/null)"
            [ "$code" = 200 ] && echo awake && exit 0
            sleep 20
          done
          exit 1
