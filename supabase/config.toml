# Supabase CLI settings for deploying the Edge Functions (supabase functions deploy ...)
project_id = "xqkdggyksufbthskmmdz"

[functions.automark]
verify_jwt = true

[functions.buy-marks]
verify_jwt = true

# Stripe calls this one directly, so it checks Stripe's signature instead of a sign-in
[functions.stripe-webhook]
verify_jwt = false

# signed-in students only: hands out short-lived B2 links to paper PDFs
[functions.pdf-url]
verify_jwt = true

# admins only: switch into, or reset, the test account
[functions.test-account]
verify_jwt = true

# the nightly data clean-up: takes no input and only deletes what is past its keep-by date
[functions.cleanup]
verify_jwt = false
